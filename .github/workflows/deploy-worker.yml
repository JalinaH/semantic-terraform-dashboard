name: Deploy worker to ECS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "worker/**"
      - "lib/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next-env.d.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy ARM64 worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Missing repository variable: AWS_ACCOUNT_ID"; exit 1; }
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "Missing repository variable: AWS_DEPLOY_ROLE_ARN"; exit 1; }
          test -n "$AWS_REGION" || { echo "Missing repository variable: AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable: ECR_REPOSITORY"; exit 1; }
          test -n "$ECS_CLUSTER" || { echo "Missing repository variable: ECS_CLUSTER"; exit 1; }
          test -n "$ECS_SERVICE" || { echo "Missing repository variable: ECS_SERVICE"; exit 1; }
          test -n "$ECS_CONTAINER_NAME" || { echo "Missing repository variable: ECS_CONTAINER_NAME"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: terrafix-worker-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push immutable worker image
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=terrafix-worker-arm64
          cache-to: type=gha,mode=max,scope=terrafix-worker-arm64
          provenance: false

      - name: Render a new task definition from the running service
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          test -n "$CURRENT_TASK_DEFINITION" && test "$CURRENT_TASK_DEFINITION" != "None" || {
            echo "The configured ECS service has no active task definition."
            exit 1
          }

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/current-task-definition.json"

          jq -e --arg name "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $name)] | length == 1' \
            "$RUNNER_TEMP/current-task-definition.json" > /dev/null || {
              echo "ECS_CONTAINER_NAME must match exactly one task-definition container."
              exit 1
            }

          jq -e '.runtimePlatform.cpuArchitecture == "ARM64" and .runtimePlatform.operatingSystemFamily == "LINUX"' \
            "$RUNNER_TEMP/current-task-definition.json" > /dev/null || {
              echo "The current ECS task definition must use Linux/ARM64."
              exit 1
            }

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" '
            .containerDefinitions |= map(if .name == $name then .image = $image else . end)
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' "$RUNNER_TEMP/current-task-definition.json" > "$RUNNER_TEMP/next-task-definition.json"

      - name: Register task revision and deploy service
        run: |
          NEXT_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/next-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEXT_TASK_DEFINITION" \
            --force-new-deployment \
            --query 'service.serviceArn' \
            --output text

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Deployment summary
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          {
            echo "## Worker deployed"
            echo
            echo "- Image: \`$IMAGE_URI\`"
            echo "- Cluster: \`$ECS_CLUSTER\`"
            echo "- Service: \`$ECS_SERVICE\`"
            echo "- Architecture: \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
