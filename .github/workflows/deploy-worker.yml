name: Deploy worker to ECS

on:
  repository_dispatch:
    types: [semantic-terraform-agent-released]
  workflow_dispatch:
    inputs:
      agent_tag:
        description: "Stable agent release tag; leave empty to use the latest release"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "worker/**"
      - "lib/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next-env.d.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy ARM64 worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Missing repository variable: AWS_ACCOUNT_ID"; exit 1; }
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "Missing repository variable: AWS_DEPLOY_ROLE_ARN"; exit 1; }
          test -n "$AWS_REGION" || { echo "Missing repository variable: AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable: ECR_REPOSITORY"; exit 1; }
          test -n "$ECS_CLUSTER" || { echo "Missing repository variable: ECS_CLUSTER"; exit 1; }
          test -n "$ECS_SERVICE" || { echo "Missing repository variable: ECS_SERVICE"; exit 1; }
          test -n "$ECS_CONTAINER_NAME" || { echo "Missing repository variable: ECS_CONTAINER_NAME"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve and validate immutable agent release
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.agent_tag }}
          DISPATCH_VERSION: ${{ github.event.client_payload.agent_version }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.agent_commit }}
          MANUAL_TAG: ${{ inputs.agent_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            AGENT_TAG="$DISPATCH_TAG"
            AGENT_VERSION="$DISPATCH_VERSION"
            EXPECTED_COMMIT="$DISPATCH_COMMIT"
          elif [ -n "$MANUAL_TAG" ]; then
            AGENT_TAG="$MANUAL_TAG"
            AGENT_VERSION="${AGENT_TAG#v}"
            EXPECTED_COMMIT=""
          else
            AGENT_TAG=$(gh api repos/JalinaH/semantic-terraform-agent/releases/latest --jq '.tag_name')
            AGENT_VERSION="${AGENT_TAG#v}"
            EXPECTED_COMMIT=""
          fi

          printf '%s' "$AGENT_TAG" | grep -Eq '^v1\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$' || {
            echo "Only stable semantic-terraform-agent v1.x releases can deploy automatically."
            exit 1
          }
          test "$AGENT_VERSION" = "${AGENT_TAG#v}" || {
            echo "The dispatched agent version does not match its release tag."
            exit 1
          }

          AGENT_COMMIT=$(gh api "repos/JalinaH/semantic-terraform-agent/commits/$AGENT_TAG" --jq '.sha')
          printf '%s' "$AGENT_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "The agent release tag did not resolve to an immutable commit."
            exit 1
          }
          if [ -n "$EXPECTED_COMMIT" ] && [ "$EXPECTED_COMMIT" != "$AGENT_COMMIT" ]; then
            echo "The dispatched commit does not match the release tag."
            exit 1
          fi

          PACKAGE_VERSION=$(curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/JalinaH/semantic-terraform-agent/$AGENT_COMMIT/pyproject.toml" \
            | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
          test "$PACKAGE_VERSION" = "$AGENT_VERSION" || {
            echo "The agent package version does not match the release tag."
            exit 1
          }

          SHORT_AGENT_COMMIT=${AGENT_COMMIT:0:12}
          SHORT_DASHBOARD_COMMIT=${GITHUB_SHA:0:12}
          {
            echo "tag=$AGENT_TAG"
            echo "version=$AGENT_VERSION"
            echo "commit=$AGENT_COMMIT"
            echo "image_tag=agent-$AGENT_VERSION-$SHORT_AGENT_COMMIT-dashboard-$SHORT_DASHBOARD_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: terrafix-worker-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push immutable worker image
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.agent.outputs.image_tag }}
          build-args: |
            SEMANTIC_TERRAFORM_AGENT_VERSION=${{ steps.agent.outputs.version }}
            SEMANTIC_TERRAFORM_AGENT_SOURCE=git+https://github.com/JalinaH/semantic-terraform-agent.git@${{ steps.agent.outputs.commit }}
          cache-from: type=gha,scope=terrafix-worker-arm64
          cache-to: type=gha,mode=max,scope=terrafix-worker-arm64
          provenance: false

      - name: Render a new task definition from the running service
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.agent.outputs.image_tag }}
          AGENT_VERSION: ${{ steps.agent.outputs.version }}
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          test -n "$CURRENT_TASK_DEFINITION" && test "$CURRENT_TASK_DEFINITION" != "None" || {
            echo "The configured ECS service has no active task definition."
            exit 1
          }

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/current-task-definition.json"

          jq -e --arg name "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $name)] | length == 1' \
            "$RUNNER_TEMP/current-task-definition.json" > /dev/null || {
              echo "ECS_CONTAINER_NAME must match exactly one task-definition container."
              exit 1
            }

          jq -e '.runtimePlatform.cpuArchitecture == "ARM64" and .runtimePlatform.operatingSystemFamily == "LINUX"' \
            "$RUNNER_TEMP/current-task-definition.json" > /dev/null || {
              echo "The current ECS task definition must use Linux/ARM64."
              exit 1
            }

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" --arg agentVersion "$AGENT_VERSION" '
            .containerDefinitions |= map(
              if .name == $name then
                .image = $image
                | .environment = (
                    ((.environment // []) | map(select(.name != "SEMANTIC_TERRAFORM_AGENT_VERSION")))
                    + [{"name": "SEMANTIC_TERRAFORM_AGENT_VERSION", "value": $agentVersion}]
                  )
              else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' "$RUNNER_TEMP/current-task-definition.json" > "$RUNNER_TEMP/next-task-definition.json"

      - name: Register task revision and deploy service
        run: |
          NEXT_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/next-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEXT_TASK_DEFINITION" \
            --force-new-deployment \
            --query 'service.serviceArn' \
            --output text

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Deployment summary
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.agent.outputs.image_tag }}
          AGENT_TAG: ${{ steps.agent.outputs.tag }}
          AGENT_COMMIT: ${{ steps.agent.outputs.commit }}
        run: |
          {
            echo "## Worker deployed"
            echo
            echo "- Image: \`$IMAGE_URI\`"
            echo "- Agent release: \`$AGENT_TAG\`"
            echo "- Agent commit: \`$AGENT_COMMIT\`"
            echo "- Cluster: \`$ECS_CLUSTER\`"
            echo "- Service: \`$ECS_SERVICE\`"
            echo "- Architecture: \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
